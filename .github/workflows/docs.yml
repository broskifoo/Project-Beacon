name: Build & Verify Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'adr/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'adr/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs.yml'

jobs:
  lint-docs:
    name: Markdown Lint & Link Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Markdown Lint Check
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            docs/**/*.md
            adr/**/*.md
            *.md

      - name: Verify Link Integrity
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          args: --verbose --no-progress --exclude-mail docs/ adr/ *.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docs:
    name: Compile Documentation Site
    needs: lint-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-size: '3.x'

      - name: Install Documentation Tools
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-mermaid2-plugin

      - name: Build MkDocs Site
        run: |
          # Placeholder configuration check (or build mock site)
          echo "Building MkDocs documentation site..."
          # mkdocs build --strict
